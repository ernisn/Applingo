name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1 for a pre-release) to build a signed APK and create a draft GitHub
# Release with it; edit the notes on GitHub and publish it from there.
# Run manually (Actions → Release → Run workflow) to produce a signed test build as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, to list the commits since the previous release.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-beta.1 (got '$GITHUB_REF_NAME')"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Fails fast with a readable message instead of a Gradle stack trace, without printing any secret.
      - name: Decode and check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!s}" ]]; then echo "::error::Repository secret $s is not set"; exit 1; fi
          done
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$ks"

          # Values set from a Windows shell often carry a trailing CR/LF; keep only the first line.
          first_line() { local v="$1"; printf '%s' "${v%%[$'\r\n']*}"; }
          export STORE_PW="$(first_line "$KEYSTORE_PASSWORD")"
          alias="$(first_line "$KEY_ALIAS")"
          key_pw="$(first_line "$KEY_PASSWORD")"
          echo "::add-mask::$STORE_PW"; echo "::add-mask::$alias"; echo "::add-mask::$key_pw"

          if ! keytool -list -keystore "$ks" -storepass:env STORE_PW > /dev/null 2>&1; then
            echo "::error::Cannot open the keystore: KEYSTORE_PASSWORD is wrong or KEYSTORE_BASE64 is not a valid keystore"
            exit 1
          fi
          if ! keytool -list -keystore "$ks" -storepass:env STORE_PW -alias "$alias" > /dev/null 2>&1; then
            count=$(keytool -list -keystore "$ks" -storepass:env STORE_PW | grep -c 'PrivateKeyEntry' || true)
            echo "::error::KEY_ALIAS matches no key in the keystore (it holds $count private key entries). Check the alias with keytool -list."
            exit 1
          fi
          {
            echo "APPLINGO_KEYSTORE_FILE=$ks"
            echo "APPLINGO_KEYSTORE_PASSWORD=$STORE_PW"
            echo "APPLINGO_KEY_ALIAS=$alias"
            echo "APPLINGO_KEY_PASSWORD=$key_pw"
          } >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease -PappVersionName="$VERSION_NAME" --stacktrace

      - name: Collect and verify APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          out="Applingo-v${VERSION_NAME}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # Creates a draft: nothing is public until it is published on GitHub, after editing the notes.
      # The notes start as the messages of every commit since the previous release, oldest first: each
      # body (the change list) without trailers, or "- subject" when a commit has no body. A final release
      # counts from the previous final one, so it also covers its pre-releases. When a release for the tag
      # already exists (re-run, or created on GitHub beforehand), only the files are uploaded to it.
      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber
          else
            exclude=()
            [[ "$TAG" != *-* ]] && exclude=(--exclude '*-*')
            prev=$(git describe --tags --abbrev=0 --match 'v*' "${exclude[@]}" "$TAG^" 2>/dev/null || true)
            if [[ -n "$prev" ]]; then
              commits=$(git rev-list --reverse --no-merges "$prev..$TAG")
            else
              commits=$(git rev-list -1 "$TAG")
            fi
            notes="$RUNNER_TEMP/release-notes.md"
            for c in $commits; do
              body=$(git log -1 --format=%b "$c" | grep -v -i -E '^(co-authored-by|signed-off-by):|^-{3,}$' || true)
              if [[ -z "$(tr -d '[:space:]' <<< "$body")" ]]; then body="- $(git log -1 --format=%s "$c")"; fi
              printf '%s\n\n' "$body"
            done | cat -s > "$notes"
            flags=(--draft)
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            url=$(gh release create "$TAG" "$FILE" "$FILE.sha256" --title "Applingo $TAG" --notes-file "$notes" --verify-tag "${flags[@]}")
            echo "Draft release created; edit the notes and publish it: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
